name: Build Chemistry Reference PDF

on:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Crawl depth (default: 5)'
        required: false
        default: '5'

permissions:
  contents: write
  packages: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget pandoc texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-science \
            librsvg2-bin python3-pip poppler-utils
          pip3 install beautifulsoup4

      - name: Download Chemistry Textbooks
        run: |
          mkdir -p html-books
          
          # Download each book separately
          echo "Downloading Organic Chemistry..."
          wget \
            --recursive \
            --level=${{ github.event.inputs.depth }} \
            --no-parent \
            --wait=0.5 \
            --random-wait \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-verbose \
            --directory-prefix=html-books/organic \
            https://chem.libretexts.org/Bookshelves/Organic_Chemistry/ || true
          
          echo "Downloading Inorganic Chemistry..."
          wget \
            --recursive \
            --level=${{ github.event.inputs.depth }} \
            --no-parent \
            --wait=0.5 \
            --random-wait \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-verbose \
            --directory-prefix=html-books/inorganic \
            https://chem.libretexts.org/Bookshelves/Inorganic_Chemistry/ || true
          
          echo "Downloading Physical Chemistry..."
          wget \
            --recursive \
            --level=${{ github.event.inputs.depth }} \
            --no-parent \
            --wait=0.5 \
            --random-wait \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-verbose \
            --directory-prefix=html-books/physical \
            https://chem.libretexts.org/Bookshelves/Physical_and_Theoretical_Chemistry/ || true
          
          echo "Downloading Analytical Chemistry..."
          wget \
            --recursive \
            --level=${{ github.event.inputs.depth }} \
            --no-parent \
            --wait=0.5 \
            --random-wait \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-verbose \
            --directory-prefix=html-books/analytical \
            https://chem.libretexts.org/Bookshelves/Analytical_Chemistry/ || true
          
          echo "Downloading General Chemistry..."
          wget \
            --recursive \
            --level=${{ github.event.inputs.depth }} \
            --no-parent \
            --wait=0.5 \
            --random-wait \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-verbose \
            --directory-prefix=html-books/general \
            https://chem.libretexts.org/Bookshelves/General_Chemistry/ || true

      - name: Show download results
        run: |
          echo "========================================="
          echo "DOWNLOAD RESULTS"
          echo "========================================="
          for dir in html-books/*/; do
            name=$(basename "$dir")
            count=$(find "$dir" -name "*.html" -o -name "*.htm" | wc -l)
            size=$(du -sh "$dir" | cut -f1)
            echo "$name: $count HTML files, $size"
            
            # Show directory structure
            if [ "$count" -lt 10 ]; then
              echo "  Directory structure:"
              find "$dir" -type d | head -20
              echo "  Files found:"
              find "$dir" -type f | head -20
            fi
          done

      - name: Process HTML to Markdown
        run: |
          mkdir -p processed-books
          
          python3 << 'PYEOF'
          import os, re
          from bs4 import BeautifulSoup
          
          def find_all_html_files(root_dir):
              """Find ALL HTML files recursively"""
              html_files = []
              if not os.path.isdir(root_dir):
                  return html_files
              for dirpath, dirnames, filenames in os.walk(root_dir):
                  for filename in filenames:
                      if filename.endswith(('.html', '.htm', '.xhtml')):
                          html_files.append(os.path.join(dirpath, filename))
              return sorted(html_files)
          
          def extract_text_content(html_file):
              """Extract text content from HTML file"""
              try:
                  with open(html_file, 'r', encoding='utf-8', errors='ignore') as f:
                      html_content = f.read()
                  
                  soup = BeautifulSoup(html_content, 'html.parser')
                  
                  # Try multiple content selectors
                  content = (
                      soup.find('div', id='content') or
                      soup.find('div', class_='mt-content-container') or
                      soup.find('div', class_='entry-content') or
                      soup.find('main') or
                      soup.find('article') or
                      soup.find('div', role='main') or
                      soup.find('body')
                  )
                  
                  if not content:
                      return None, None
                  
                  # Get title
                  title_tag = soup.find('h1') or soup.find('title')
                  title = title_tag.get_text().strip() if title_tag else "Untitled"
                  title = re.sub(r'\s+', ' ', title)
                  
                  # Remove scripts, styles, etc
                  for tag in content.find_all(['script', 'style', 'nav', 'footer', 'iframe', 'svg']):
                      tag.decompose()
                  
                  # Extract text with structure
                  lines = []
                  for element in content.find_all(['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'li', 'pre', 'code']):
                      text = element.get_text().strip()
                      if not text:
                          continue
                      
                      if element.name.startswith('h'):
                          level = int(element.name[1])
                          lines.append('#' * level + ' ' + text)
                      elif element.name == 'p':
                          if len(text) > 10:  # Skip very short paragraphs
                              lines.append(text)
                      elif element.name == 'li':
                          lines.append('- ' + text)
                      elif element.name in ('pre', 'code'):
                          lines.append('```\n' + text + '\n```')
                      
                      lines.append('')  # Add blank line
                  
                  if not lines:
                      return None, None
                  
                  return title, '\n'.join(lines)
                  
              except Exception as e:
                  return None, None
          
          # Define books
          books = {
              'Organic-Chemistry': 'html-books/organic',
              'Inorganic-Chemistry': 'html-books/inorganic',
              'Physical-Chemistry': 'html-books/physical',
              'Analytical-Chemistry': 'html-books/analytical',
              'General-Chemistry': 'html-books/general'
          }
          
          for book_name, book_path in books.items():
              print('\n' + '='*60)
              print('Processing: ' + book_name)
              print('Path: ' + book_path)
              print('='*60)
              
              if not os.path.isdir(book_path):
                  print('Directory not found, skipping...')
                  continue
              
              # Find files
              html_files = find_all_html_files(book_path)
              print('Found ' + str(len(html_files)) + ' HTML files')
              
              if len(html_files) == 0:
                  print('Checking directory contents:')
                  for root, dirs, files in os.walk(book_path):
                      for f in files[:10]:
                          print('  ' + os.path.join(root, f))
                  continue
              
              # Extract content
              sections = []
              skipped = 0
              
              for i, html_file in enumerate(html_files):
                  title, content = extract_text_content(html_file)
                  if content and len(content) > 100:  # Minimum content threshold
                      sections.append('## ' + title + '\n\n' + content + '\n\n\\newpage\n')
                  else:
                      skipped += 1
                  
                  if (i + 1) % 100 == 0:
                      print('  Progress: ' + str(i + 1) + '/' + str(len(html_files)))
              
              print('Extracted ' + str(len(sections)) + ' sections')
              print('Skipped ' + str(skipped) + ' empty files')
              
              # Save book
              if sections:
                  output_file = 'processed-books/' + book_name + '.md'
                  with open(output_file, 'w', encoding='utf-8') as f:
                      f.write('# ' + book_name.replace('-', ' ') + '\n\n')
                      f.write('\n'.join(sections))
                  
                  size_mb = os.path.getsize(output_file) / 1024 / 1024
                  print('Saved: ' + output_file + ' (' + str(round(size_mb, 1)) + ' MB)')
          
          print('\nDone processing all books!')
          PYEOF

      - name: Show processed books
        run: |
          echo "========================================="
          echo "PROCESSED BOOKS"
          echo "========================================="
          for f in processed-books/*.md; do
            if [ -f "$f" ]; then
              name=$(basename "$f" .md)
              sections=$(grep -c "^## " "$f" || echo 0)
              size=$(du -sh "$f" | cut -f1)
              echo "$name: $sections sections, $size"
            fi
          done

      - name: Build master document
        run: |
          cat > chemistry-master.md << 'EOF'
          # Complete Chemistry Reference Library
          
          **5 Core Textbooks | Offline Reference | Searchable PDF**
          
          \newpage
          
          # Table of Contents
          
          \newpage
          EOF
          
          for book_file in processed-books/*.md; do
            if [ -f "$book_file" ]; then
              book_name=$(basename "$book_file" .md | sed 's/-/ /g')
              echo "" >> chemistry-master.md
              echo "# $book_name" >> chemistry-master.md
              echo "" >> chemistry-master.md
              echo "\newpage" >> chemistry-master.md
              echo "" >> chemistry-master.md
              cat "$book_file" >> chemistry-master.md
              echo "" >> chemistry-master.md
              echo "\newpage" >> chemistry-master.md
            fi
          done
          
          echo "Master document: $(wc -l < chemistry-master.md) lines"

      - name: Build PDF
        run: |
          echo "Building PDF..."
          
          pandoc chemistry-master.md \
            --from markdown \
            --to pdf \
            --pdf-engine=xelatex \
            --toc \
            --toc-depth=3 \
            --metadata title="Chemistry Reference Library" \
            --metadata author="LibreTexts" \
            --variable mainfont="DejaVu Serif" \
            --variable geometry:margin=1in \
            --variable fontsize=11pt \
            -o Chemistry-Library.pdf 2>&1 | tail -20
          
          if [ -f Chemistry-Library.pdf ]; then
            echo "PDF created!"
            ls -lh Chemistry-Library.pdf
          else
            echo "PDF creation failed!"
            exit 1
          fi

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chemistry-Library-PDF
          path: Chemistry-Library.pdf
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Chemistry Library - Build ${{ github.run_number }}"
          tag_name: "chemistry-build-${{ github.run_number }}"
          files: Chemistry-Library.pdf
          body: |
            ## Chemistry Reference Library PDF
            
            **5 Core Textbooks:**
            - Organic Chemistry
            - Inorganic Chemistry  
            - Physical Chemistry
            - Analytical Chemistry
            - General Chemistry
            
            **Build:** ${{ github.run_number }}
            **Date:** $(date +%Y-%m-%d)
          token: ${{ secrets.GITHUB_TOKEN }}
