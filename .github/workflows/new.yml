name: 📚 Build Chemistry Reference PDF

on:
  workflow_dispatch:
    inputs:
      include_branches:
        description: 'Chemistry branches (comma-separated)'
        required: false
        default: 'organic,inorganic,physical,analytical,general'
      split_size:
        description: 'Split size for large PDFs (e.g., 1900M, 500M)'
        required: false
        default: '1900M'
  
  schedule:
    - cron: '0 0 1 * *'  # Monthly rebuild

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🛠️ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            pandoc \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            python3-pip \
            wkhtmltopdf \
            poppler-utils
          
          pip3 install beautifulsoup4

      - name: 🌍 Download Chemistry Textbooks
        run: |
          mkdir -p raw-html
          
          declare -A BOOKS=(
            ["01-Organic-Chemistry"]="https://chem.libretexts.org/Bookshelves/Organic_Chemistry/"
            ["02-Inorganic-Chemistry"]="https://chem.libretexts.org/Bookshelves/Inorganic_Chemistry/"
            ["03-Physical-Chemistry"]="https://chem.libretexts.org/Bookshelves/Physical_and_Theoretical_Chemistry/"
            ["04-Analytical-Chemistry"]="https://chem.libretexts.org/Bookshelves/Analytical_Chemistry/"
            ["05-General-Chemistry"]="https://chem.libretexts.org/Bookshelves/General_Chemistry/"
          )
          
          for branch in "${!BOOKS[@]}"; do
            echo "========================================="
            echo "📚 Downloading: $branch"
            echo "========================================="
            
            wget \
              --mirror \
              --convert-links \
              --adjust-extension \
              --page-requisites \
              --no-parent \
              --wait=0.3 \
              --level=inf \
              --accept-regex "${BOOKS[$branch]}.*" \
              --reject-regex '(\.pdf$|\.PDF$|\.zip$|\.epub$)' \
              --directory-prefix="./raw-html/$branch" \
              --no-verbose \
              --show-progress \
              ${BOOKS[$branch]} || echo "⚠️ Some pages for $branch failed (continuing)"
            
            echo "✅ $branch download complete"
            echo ""
          done
          
          echo "========================================="
          echo "📊 Download Summary:"
          echo "========================================="
          du -sh raw-html/*/

      - name: 🔧 Process HTML to Clean Content
        run: |
          cat > clean_html.py << 'PYEOF'
          import os, sys, glob
          from bs4 import BeautifulSoup
          from pathlib import Path
          
          def extract_content(html_file):
              """Extract meaningful content from LibreTexts HTML"""
              try:
                  with open(html_file, 'r', encoding='utf-8', errors='ignore') as f:
                      soup = BeautifulSoup(f.read(), 'html.parser')
              except:
                  return None, None
              
              # Find main content area
              content = (
                  soup.find('div', {'id': 'content'}) or 
                  soup.find('div', class_='mt-content-container') or
                  soup.find('main') or 
                  soup.find('article') or
                  soup.find('body')
              )
              
              if not content:
                  return None, None
              
              # Get title
              title_tag = soup.find('h1') or soup.find('title')
              title = title_tag.get_text().strip() if title_tag else os.path.basename(html_file)
              
              # Remove unwanted elements
              for tag in content.find_all(['script', 'style', 'nav', 'header', 'footer', 
                                           'button', 'input', 'select', 'iframe']):
                  tag.decompose()
              
              # Build clean markdown
              md = []
              
              for element in content.find_all(['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 
                                               'p', 'li', 'img', 'table', 'pre', 'code']):
                  if element.name.startswith('h'):
                      level = int(element.name[1])
                      md.append(f"\n{'#' * level} {element.get_text().strip()}\n")
                  
                  elif element.name == 'p':
                      text = element.get_text().strip()
                      if text:
                          md.append(f"{text}\n")
                  
                  elif element.name == 'li':
                      md.append(f"- {element.get_text().strip()}\n")
                  
                  elif element.name == 'img':
                      src = element.get('src', '')
                      alt = element.get('alt', 'Image')
                      if src:
                          md.append(f"\n![{alt}]({src})\n")
                  
                  elif element.name == 'table':
                      md.append("\n[Table - see original for details]\n")
                  
                  elif element.name in ['pre', 'code']:
                      md.append(f"\n```\n{element.get_text().strip()}\n```\n")
              
              return title, '\n'.join(md)
          
          # Process all books
          books_dir = 'raw-html'
          output_dir = 'processed-books'
          
          for book_folder in sorted(os.listdir(books_dir)):
              book_path = os.path.join(books_dir, book_folder)
              if not os.path.isdir(book_path):
                  continue
              
              print(f"\n{'='*50}")
              print(f"Processing: {book_folder}")
              print(f"{'='*50}")
              
              # Find all HTML files
              html_files = []
              for root, dirs, files in os.walk(book_path):
                  for file in files:
                      if file.endswith(('.html', '.htm')):
                          html_files.append(os.path.join(root, file))
              
              html_files.sort()
              print(f"Found {len(html_files)} pages")
              
              # Process each page
              book_content = []
              for idx, html_file in enumerate(html_files):
                  title, content = extract_content(html_file)
                  if content:
                      book_content.append(content)
                  
                  if (idx + 1) % 100 == 0:
                      print(f"  Progress: {idx + 1}/{len(html_files)}")
              
              # Save combined book
              os.makedirs(output_dir, exist_ok=True)
              output_file = os.path.join(output_dir, f"{book_folder}.md")
              combined = '\n\n\\pagebreak\n\n'.join(book_content)
              
              with open(output_file, 'w', encoding='utf-8') as f:
                  f.write(f"# {book_folder.replace('-', ' ')}\n\n")
                  f.write(combined)
              
              print(f"✅ Saved: {output_file} ({len(book_content)} pages)")
          
          print(f"\n{'='*50}")
          print("✅ ALL BOOKS PROCESSED!")
          PYEOF
          
          python3 clean_html.py

      - name: 📑 Build Table of Contents
        run: |
          cat > build_toc.py << 'PYEOF'
          def create_toc():
              toc = [
                  "# 📚 Complete Chemistry Reference Library\n",
                  "## Table of Contents\n",
                  "*(Click any chapter or section to navigate)*\n\n"
              ]
              
              book_configs = [
                  ("01-Organic-Chemistry", "🧪 Organic Chemistry"),
                  ("02-Inorganic-Chemistry", "⚗️ Inorganic Chemistry"),
                  ("03-Physical-Chemistry", "🔬 Physical & Theoretical Chemistry"),
                  ("04-Analytical-Chemistry", "📊 Analytical Chemistry"),
                  ("05-General-Chemistry", "🧬 General Chemistry"),
              ]
              
              book_num = 0
              for folder, title in book_configs:
                  book_num += 1
                  toc.append(f"\n## {book_num}. {title}\n")
                  
                  md_file = f"processed-books/{folder}.md"
                  try:
                      with open(md_file, 'r', encoding='utf-8') as f:
                          for line in f:
                              if line.startswith('## ') or line.startswith('### '):
                                  depth = '  ' if line.startswith('### ') else ''
                                  section = line.strip('#').strip()
                                  toc.append(f"{depth}- [{section}](#{section.lower().replace(' ', '-')})\n")
                  except FileNotFoundError:
                      toc.append(f"*(Content pending)*\n")
              
              toc.append("\n\\pagebreak\n")
              return ''.join(toc)
          
          with open('TABLE_OF_CONTENTS.md', 'w', encoding='utf-8') as f:
              f.write(create_toc())
          
          print("✅ Table of Contents created!")
          PYEOF
          
          python3 build_toc.py

      - name: 📚 Combine into Master Document
        run: |
          echo "# 📚 Complete Chemistry Reference Library" > chemistry-master.md
          echo "" >> chemistry-master.md
          echo "**5 Core Chemistry Textbooks • Full Offline Reference**" >> chemistry-master.md
          echo "" >> chemistry-master.md
          echo "\\pagebreak" >> chemistry-master.md
          
          # Add TOC
          cat TABLE_OF_CONTENTS.md >> chemistry-master.md
          echo "\\pagebreak" >> chemistry-master.md
          
          # Add each book
          for book_file in processed-books/*.md; do
            book_name=$(basename "$book_file" .md | sed 's/^[0-9]*-//')
            echo "" >> chemistry-master.md
            echo "# $(echo $book_name | sed 's/-/ /g')" >> chemistry-master.md
            echo "\\pagebreak" >> chemistry-master.md
            cat "$book_file" >> chemistry-master.md
            echo "\\pagebreak" >> chemistry-master.md
          done
          
          echo "✅ Master document created!"
          wc -l chemistry-master.md

      - name: 🎨 Create Header for PDF Styling
        run: |
          cat > header.tex << 'LATEX'
          % Hyperlinks and PDF metadata
          \usepackage{hyperref}
          \hypersetup{
            colorlinks=true,
            linkcolor=blue,
            filecolor=magenta,
            urlcolor=cyan,
            pdftitle={Complete Chemistry Reference Library},
            pdfauthor={LibreTexts Chemistry},
            pdfsubject={Chemistry - Organic, Inorganic, Physical, Analytical, General},
            pdfkeywords={chemistry, organic, inorganic, physical, analytical, general},
            bookmarks=true,
            bookmarksnumbered=true,
            bookmarkstype=toc,
            pdfstartview=FitH,
            pdfpagemode=UseOutlines,
          }
          
          % Page styling
          \usepackage{fancyhdr}
          \pagestyle{fancy}
          \fancyhf{}
          \fancyhead[LE,RO]{Chemistry Reference Library}
          \fancyhead[RE,LO]{LibreTexts}
          \fancyfoot[CE,CO]{\thepage}
          \renewcommand{\headrulewidth}{0.4pt}
          \renewcommand{\footrulewidth}{0.4pt}
          
          % Table of Contents styling
          \usepackage{tocloft}
          \renewcommand{\cftsecfont}{\bfseries\Large}
          \renewcommand{\cftsubsecfont}{\bfseries}
          \renewcommand{\cftsubsubsecfont}{\itshape}
          
          % Image handling
          \usepackage{graphicx}
          \graphicspath{{./images/}}
          \DeclareGraphicsExtensions{.png,.jpg,.pdf}
          
          % Chemistry specific
          \usepackage[version=4]{mhchem}
          \usepackage{siunitx}
          LATEX

      - name: 📄 Build Searchable PDF
        run: |
          echo "🔄 Converting to PDF (this may take 30-60 minutes)..."
          
          pandoc chemistry-master.md \
            --from markdown \
            --to pdf \
            --pdf-engine=xelatex \
            --toc \
            --toc-depth=4 \
            --number-sections \
            --highlight-style=tango \
            --include-in-header=header.tex \
            --metadata title="Complete Chemistry Reference Library" \
            --metadata author="LibreTexts Chemistry" \
            --metadata date="$(date +%Y-%m-%d)" \
            --metadata lang="en-US" \
            --variable mainfont="DejaVu Serif" \
            --variable sansfont="DejaVu Sans" \
            --variable monofont="DejaVu Sans Mono" \
            --variable mathfont="DejaVu Math TeX Gyre" \
            --variable geometry:margin=1in \
            --variable fontsize=11pt \
            --variable documentclass=book \
            -o "Chemistry-Reference-Library.pdf"
          
          echo "✅ PDF created!"
          ls -lh Chemistry-Reference-Library.pdf

      - name: 📊 PDF Statistics
        run: |
          echo "========================================="
          echo "📊 FINAL PDF STATISTICS"
          echo "========================================="
          echo "File size: $(ls -lh Chemistry-Reference-Library.pdf | awk '{print $5}')"
          echo "Pages: $(pdfinfo Chemistry-Reference-Library.pdf 2>/dev/null | grep Pages | awk '{print $2}' || echo 'Processing...')"
          echo "PDF version: $(pdfinfo Chemistry-Reference-Library.pdf 2>/dev/null | grep 'PDF version' || echo '1.5+')"
          echo ""
          echo "📚 Included Textbooks:"
          echo "  1. 🧪 Organic Chemistry"
          echo "  2. ⚗️ Inorganic Chemistry"
          echo "  3. 🔬 Physical & Theoretical Chemistry"
          echo "  4. 📊 Analytical Chemistry"
          echo "  5. 🧬 General Chemistry"
          echo ""
          echo "🎯 Features:"
          echo "  ✅ Interactive Table of Contents"
          echo "  ✅ Clickable internal links"
          echo "  ✅ Full-text search enabled"
          echo "  ✅ Printer-friendly"
          echo "  ✅ Mobile/tablet compatible"
          echo "========================================="

      - name: 📦 Split and Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: "Chemistry Library v${{ github.run_number }} - $(date +%Y-%m-%d)"
          tag_name: "chemistry-${{ github.run_number }}"
          files: |
            Chemistry-Reference-Library.pdf
            chemistry-master.md
            TABLE_OF_CONTENTS.md
          body: |
            # 📚 Complete Chemistry Reference Library
            
            ## ✨ Build #${{ github.run_number }} - $(date +%Y-%m-%d)
            
            ### 📖 Included Textbooks:
            | # | Branch | Description |
            |---|--------|-------------|
            | 1 | 🧪 **Organic Chemistry** | Reactions, mechanisms, synthesis |
            | 2 | ⚗️ **Inorganic Chemistry** | Coordination, crystal field, organometallics |
            | 3 | 🔬 **Physical Chemistry** | Thermodynamics, quantum, kinetics |
            | 4 | 📊 **Analytical Chemistry** | Spectroscopy, chromatography |
            | 5 | 🧬 **General Chemistry** | Fundamentals, stoichiometry, bonding |
            
            ### 🎯 PDF Features:
            - ✅ **Interactive Table of Contents** - click to navigate
            - 🔗 **Clickable internal cross-references**
            - 🔍 **Full-text search** (Ctrl+F / Cmd+F)
            - 📑 **PDF bookmarks panel** for quick access
            - 📱 **Works on all devices**
            - 🖨️ **Print-ready formatting**
            
            ### 📊 Technical Details:
            - **Estimated pages**: 6,000 - 7,500
            - **File size**: ~300-500 MB
            - **Format**: PDF with selectable text
            - **Source**: chem.libretexts.org
            
            ---
            *Built with ❤️ using GitHub Actions • Powered by LibreTexts*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Cleanup Old Releases
        run: |
          # Keep only the 3 most recent releases
          gh release list --limit 100 --json tagName --jq '.[].tagName' | \
            grep "chemistry-" | tail -n +4 | \
            while read tag; do
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes
            done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
