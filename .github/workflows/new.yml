name: 🔄 Leecher - Download & Split

on:
  workflow_dispatch:
    inputs:
      leech_url:
        description: '🔗 Direct download URL'
        required: true
        type: string
      leech_folder:
        description: '📁 Custom folder name (leave empty to auto‑detect from URL)'
        required: false
        type: string
        default: ''
      leech_safe:
        description: '🛡️ Safe mode (use custom name if provided, otherwise auto‑name)'
        required: false
        type: boolean
        default: false
      leech_split:
        description: '✂️ Split size (e.g. 10M, 20M, 50M)'
        required: false
        type: string
        default: '20M'

permissions:
  contents: write

jobs:
  leecher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and Split File
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          
          URL="${{ inputs.leech_url }}"
          FOLDER_INPUT="${{ inputs.leech_folder }}"
          SAFE="${{ inputs.leech_safe }}"
          SPLIT="${{ inputs.leech_split }}"
          [ -z "$SPLIT" ] && SPLIT="20M"
          
          # Extract raw filename from URL (without query string)
          RAW=$(basename "${URL%%\?*}" | sed 's/%20/ /g')
          EXT="${RAW##*.}"
          # If no extension found, treat whole name as base
          if [ "$EXT" = "$RAW" ] || [ -z "$EXT" ]; then
            BASE="$RAW"
            EXT="file"
          else
            BASE="${RAW%.*}"
          fi
          
          # Decide final folder name
          if [ -n "$FOLDER_INPUT" ]; then
            FOLDER="$FOLDER_INPUT"
          else
            FOLDER="$BASE"   # auto‑detected from URL
          fi
          
          # Determine final file name inside the folder
          if [ "$SAFE" = "true" ]; then
            FINAL="${FOLDER}.${EXT}"
          else
            FINAL="${BASE}.${EXT}"
          fi
          
          echo "📁 Folder: $FOLDER"
          echo "📄 Final filename: $FINAL"
          echo "🌐 Downloading: $URL"
          
          curl -L --fail --retry 5 -A "Mozilla/5.0" -o "temp_download" "$URL" || exit 1
          
          FILE_SIZE=$(du -h temp_download | cut -f1)
          echo "Downloaded: $FILE_SIZE"
          
          mkdir -p wrap_dir
          mv temp_download "wrap_dir/${FINAL}"
          cd wrap_dir
          zip -0 "../${FOLDER}.zip" "${FINAL}"
          cd ..
          
          mkdir -p "save/leech/${FOLDER}"
          split -b "$SPLIT" -d -a 3 "${FOLDER}.zip" "save/leech/${FOLDER}/chunk_"
          
          a=1
          for i in save/leech/${FOLDER}/chunk_*; do
            printf -v new "save/leech/%s/%s.zip.%03d" "$FOLDER" "$FOLDER" "$a"
            mv -- "$i" "$new"
            a=$((a+1))
          done
          
          CHUNKS=$(ls save/leech/${FOLDER}/${FOLDER}.zip.* 2>/dev/null | wc -l)
          echo "Created ${CHUNKS} chunks"
          
          rm -rf wrap_dir "${FOLDER}.zip"
          echo "FOLDER=${FOLDER}" >> $GITHUB_ENV
          echo "CHUNKS=${CHUNKS}" >> $GITHUB_ENV

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || git pull origin master --rebase || true
          git add save/leech/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "🔄 Leech: ${FOLDER} (${CHUNKS} parts)"
          git push