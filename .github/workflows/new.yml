name: 📚 Build Chemistry Reference PDF

on:
  workflow_dispatch:
    inputs:
      include_branches:
        description: 'Chemistry branches (comma-separated)'
        required: false
        default: 'organic,inorganic,physical,analytical,general'
      split_size:
        description: 'Split size for large PDFs (e.g., 1900M, 500M)'
        required: false
        default: '1900M'
  
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            pandoc \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            librsvg2-bin \
            python3-pip \
            poppler-utils
          
          pip3 install beautifulsoup4

      - name: Download Chemistry Textbooks
        run: |
          mkdir -p raw-html
          
          # Download each textbook
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --wait=0.5 \
            --level=inf \
            --accept-regex '/Bookshelves/Organic_Chemistry/.*' \
            --reject-regex '(\.pdf$|\.PDF$|\.zip$|\.epub$|\.svgz$)' \
            --directory-prefix="./raw-html/Organic-Chemistry" \
            --no-verbose \
            https://chem.libretexts.org/Bookshelves/Organic_Chemistry/ || true
          
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --wait=0.5 \
            --level=inf \
            --accept-regex '/Bookshelves/Inorganic_Chemistry/.*' \
            --reject-regex '(\.pdf$|\.PDF$|\.zip$|\.epub$|\.svgz$)' \
            --directory-prefix="./raw-html/Inorganic-Chemistry" \
            --no-verbose \
            https://chem.libretexts.org/Bookshelves/Inorganic_Chemistry/ || true
          
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --wait=0.5 \
            --level=inf \
            --accept-regex '/Bookshelves/Physical_and_Theoretical_Chemistry/.*' \
            --reject-regex '(\.pdf$|\.PDF$|\.zip$|\.epub$|\.svgz$)' \
            --directory-prefix="./raw-html/Physical-Chemistry" \
            --no-verbose \
            https://chem.libretexts.org/Bookshelves/Physical_and_Theoretical_Chemistry/ || true
          
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --wait=0.5 \
            --level=inf \
            --accept-regex '/Bookshelves/Analytical_Chemistry/.*' \
            --reject-regex '(\.pdf$|\.PDF$|\.zip$|\.epub$|\.svgz$)' \
            --directory-prefix="./raw-html/Analytical-Chemistry" \
            --no-verbose \
            https://chem.libretexts.org/Bookshelves/Analytical_Chemistry/ || true
          
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --wait=0.5 \
            --level=inf \
            --accept-regex '/Bookshelves/General_Chemistry/.*' \
            --reject-regex '(\.pdf$|\.PDF$|\.zip$|\.epub$|\.svgz$)' \
            --directory-prefix="./raw-html/General-Chemistry" \
            --no-verbose \
            https://chem.libretexts.org/Bookshelves/General_Chemistry/ || true
          
          echo "Download complete!"
          find raw-html -name "*.html" | wc -l

      - name: Show download stats
        run: |
          for dir in raw-html/*/; do
            echo "$(basename $dir): $(find $dir -name '*.html' | wc -l) files, $(du -sh $dir | cut -f1)"
          done

      - name: Process HTML to Markdown
        run: |
          mkdir -p processed-books
          
          python3 << 'PYEOF'
          import os, re
          from bs4 import BeautifulSoup
          
          def find_html_files(root_dir):
              html_files = []
              for dirpath, dirnames, filenames in os.walk(root_dir):
                  for filename in filenames:
                      if filename.endswith(('.html', '.htm')):
                          html_files.append(os.path.join(dirpath, filename))
              return sorted(html_files)
          
          def extract_content(html_file):
              try:
                  with open(html_file, 'r', encoding='utf-8', errors='ignore') as f:
                      soup = BeautifulSoup(f.read(), 'html.parser')
              except:
                  return None, None
              
              content = (
                  soup.find('div', {'id': 'content'}) or 
                  soup.find('div', class_='mt-content-container') or
                  soup.find('main') or 
                  soup.find('article') or
                  soup.find('body')
              )
              
              if not content:
                  return None, None
              
              title_tag = soup.find('h1') or soup.find('title')
              title = title_tag.get_text().strip() if title_tag else os.path.basename(html_file)
              
              for tag in content.find_all(['script', 'style', 'nav', 'header', 'footer', 'button', 'input', 'select', 'iframe', 'svg']):
                  tag.decompose()
              
              md_lines = []
              for element in content.descendants:
                  if element.name is None:
                      continue
                  
                  if element.name in ['h1', 'h2', 'h3', 'h4', 'h5', 'h6']:
                      level = int(element.name[1])
                      text = element.get_text().strip()
                      if text and len(text) > 2:
                          md_lines.append("\n{} {}\n".format('#' * level, text))
                  
                  elif element.name == 'p':
                      text = element.get_text().strip()
                      if text and len(text) > 5:
                          md_lines.append(text + "\n")
                  
                  elif element.name == 'li':
                      text = element.get_text().strip()
                      if text:
                          md_lines.append("- " + text + "\n")
                  
                  elif element.name == 'img':
                      src = element.get('src', '')
                      alt = element.get('alt', 'Figure')
                      if src and not src.endswith('.svgz'):
                          md_lines.append("\n![{}]({})\n".format(alt, src))
                  
                  elif element.name in ['pre', 'code']:
                      code_text = element.get_text().strip()
                      if code_text:
                          md_lines.append("\n```\n{}\n```\n".format(code_text))
              
              if not md_lines:
                  return None, None
              
              return title, '\n'.join(md_lines)
          
          # Process each book
          books = {
              'Organic-Chemistry': 'raw-html/Organic-Chemistry',
              'Inorganic-Chemistry': 'raw-html/Inorganic-Chemistry',
              'Physical-Chemistry': 'raw-html/Physical-Chemistry',
              'Analytical-Chemistry': 'raw-html/Analytical-Chemistry',
              'General-Chemistry': 'raw-html/General-Chemistry'
          }
          
          for book_name, book_path in books.items():
              if not os.path.isdir(book_path):
                  print("Skipping {} - directory not found".format(book_name))
                  continue
              
              print("\nProcessing: {}".format(book_name))
              html_files = find_html_files(book_path)
              print("Found {} files".format(len(html_files)))
              
              if len(html_files) == 0:
                  print("No HTML files found - checking directory:")
                  for root, dirs, files in os.walk(book_path):
                      print("  {}: {}".format(root, len(files)))
                  continue
              
              book_content = []
              success = 0
              
              for idx, html_file in enumerate(html_files):
                  title, content = extract_content(html_file)
                  if content:
                      book_content.append("\n\n## {}\n\n{}".format(title, content))
                      success += 1
                  
                  if (idx + 1) % 50 == 0:
                      print("  Progress: {}/{}".format(idx + 1, len(html_files)))
              
              if book_content:
                  output_file = os.path.join('processed-books', book_name + '.md')
                  with open(output_file, 'w', encoding='utf-8') as f:
                      f.write("# {}\n\n".format(book_name.replace('-', ' ')))
                      f.write('\n\n\\newpage\n\n'.join(book_content))
                  print("Saved: {} ({} sections)".format(output_file, success))
          
          print("\nAll books processed!")
          PYEOF

      - name: Build master document
        run: |
          echo "# Complete Chemistry Reference Library" > chemistry-master.md
          echo "" >> chemistry-master.md
          echo "**5 Core Textbooks | Offline Reference | Searchable PDF**" >> chemistry-master.md
          echo "" >> chemistry-master.md
          echo "\\newpage" >> chemistry-master.md
          echo "" >> chemistry-master.md
          
          for book_file in processed-books/*.md; do
            if [ -f "$book_file" ]; then
              book_name=$(basename "$book_file" .md | sed 's/-/ /g')
              echo "" >> chemistry-master.md
              echo "# $book_name" >> chemistry-master.md
              echo "" >> chemistry-master.md
              echo "\\newpage" >> chemistry-master.md
              echo "" >> chemistry-master.md
              cat "$book_file" >> chemistry-master.md
              echo "" >> chemistry-master.md
              echo "\\newpage" >> chemistry-master.md
              echo "" >> chemistry-master.md
            fi
          done
          
          echo "Master document created: $(wc -l < chemistry-master.md) lines"

      - name: Build PDF
        run: |
          pandoc chemistry-master.md \
            --from markdown \
            --to pdf \
            --pdf-engine=xelatex \
            --toc \
            --toc-depth=3 \
            --number-sections \
            --highlight-style=tango \
            --metadata title="Complete Chemistry Reference Library" \
            --metadata author="LibreTexts Chemistry" \
            --metadata date="$(date +%Y-%m-%d)" \
            --variable mainfont="DejaVu Serif" \
            --variable sansfont="DejaVu Sans" \
            --variable monofont="DejaVu Sans Mono" \
            --variable geometry:margin=1in \
            --variable fontsize=11pt \
            --variable documentclass=book \
            -o "Chemistry-Reference-Library.pdf" 2>&1 | tee build.log
          
          if [ -f "Chemistry-Reference-Library.pdf" ]; then
            echo "PDF created successfully!"
            ls -lh Chemistry-Reference-Library.pdf
          else
            echo "PDF build failed!"
            cat build.log
            exit 1
          fi

      - name: Get page count
        run: |
          if command -v pdfinfo &> /dev/null; then
            pdfinfo Chemistry-Reference-Library.pdf
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Chemistry Library - Build ${{ github.run_number }}"
          tag_name: "chemistry-${{ github.run_number }}"
          files: Chemistry-Reference-Library.pdf
          body: |
            ## Complete Chemistry Reference Library
            
            ### Included Textbooks:
            - Organic Chemistry
            - Inorganic Chemistry
            - Physical Chemistry
            - Analytical Chemistry
            - General Chemistry
            
            ### Features:
            - Interactive Table of Contents
            - Clickable internal links
            - Full-text search (Ctrl+F)
            - PDF bookmarks for navigation
            - Works on all devices
            - Print-ready formatting
            
            Built: $(date +%Y-%m-%d)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old releases
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | \
            grep "chemistry-" | tail -n +4 | \
            while read tag; do
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
